# Supabase 無料枠の一時停止（一定期間アクセスがないと停止）を防ぐための定期ピング。
# 毎日1回、専用アカウントで「ログイン→自分の days 行を読む」ところまで実行する。
# 匿名の空クエリ（RLSで0行）ではアクティビティとカウントされない疑いがあったため、
# 認証を通して Auth・DB の両方に実アクセスする形にしてある。
name: keep-alive

on:
  schedule:
    # UTC 毎日 06:17（＝日本時間 15:17）。
    # 毎日にしている理由：停止条件が「7日間アクセスなし」ではなく
    # 「直近1週間に毎日数回のDBリクエストが必要」と解釈される場合もあるため、
    # 週2回では足りない可能性を潰しておく。実行は数秒で、無料枠を圧迫しない。
    # 分を 00 ではなく 17 にしているのは、毎時0分はGitHub側が混み合って遅延しやすいため。
    - cron: "17 6 * * *"
  workflow_dispatch: # 手動でも実行できるようにする（動作確認用）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated read (counts as real DB activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEEPALIVE_EMAIL: ${{ secrets.KEEPALIVE_EMAIL }}
          KEEPALIVE_PASSWORD: ${{ secrets.KEEPALIVE_PASSWORD }}
        run: |
          # 1) password grant でログイン＝Auth への実リクエスト。access_token を得る。
          token=$(curl -sS -f \
            "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${KEEPALIVE_EMAIL}\",\"password\":\"${KEEPALIVE_PASSWORD}\"}" \
            | jq -r '.access_token')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "login failed: access_token が取れませんでした"; exit 1
          fi

          # 2) 認証済みで自分の days 行を読む＝RLSを通過して実データに触れる（確実にDBアクティビティ）。
          rows=$(curl -sS -f \
            "${SUPABASE_URL}/rest/v1/days?select=date&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${token}" \
            | jq 'length')

          echo "keep-alive done: ${rows} row(s) read (authenticated)"
