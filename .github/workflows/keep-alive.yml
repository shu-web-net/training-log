# Supabase 無料枠の一時停止（7日間アクセスがないと停止）を防ぐための定期ピング。
# 毎日1回、days テーブルへ軽い SELECT を1回投げて「アクセスあり」の状態を保つ。
# 普段このアプリを使わなくても、本番のログイン機能を常に生かしておける。
name: keep-alive

on:
  schedule:
    # UTC 毎日 06:17（＝日本時間 15:17）。
    # 毎日にしている理由：停止条件が「7日間アクセスなし」ではなく
    # 「直近1週間に毎日数回のDBリクエストが必要」と解釈される場合もあるため、
    # 週2回では足りない可能性を潰しておく。実行は数秒で、無料枠を圧迫しない。
    # 分を 00 ではなく 17 にしているのは、毎時0分はGitHub側が混み合って遅延しやすいため。
    - cron: "17 6 * * *"
  workflow_dispatch: # 手動でも実行できるようにする（動作確認用）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # days テーブルを1行だけ問い合わせる（RLSにより匿名では空だが、DBクエリは実行される＝活動とみなされる）。
          # -f でHTTPエラー時は失敗扱いにし、異常に気づけるようにする。
          curl -sS -f \
            "${SUPABASE_URL}/rest/v1/days?select=date&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
          echo "keep-alive ping done"
